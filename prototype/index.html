<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuspid — clinical case knowledge base for dentists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────────────────── -->
<header class="topbar">
  <a class="brand" href="#/browse">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c-2.2 0-3.2 1-5 1S4 3.4 4 6.5c0 3 1 4.6 1.7 7.2.6 2.2.8 6.3 2.6 6.3 1.6 0 1.3-4.5 3.7-4.5s2.1 4.5 3.7 4.5c1.8 0 2-4.1 2.6-6.3C19 11.1 20 9.5 20 6.5 20 3.4 18.8 4 17 4s-2.8-1-5-1z"/>
      </svg>
    </span>
    <span class="brand-name">Cuspid</span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="globalSearch" class="search" type="search" autocomplete="off"
           placeholder="Search cases, complications, tools…  e.g. “separated file”">
    <kbd class="search-kbd">/</kbd>
  </div>

  <nav class="topnav">
    <a class="topnav-link" href="#/browse">Browse</a>
    <a class="topnav-link" href="#/contribute">Contribute</a>
    <a class="topnav-link" href="#/verify">Verification</a>
  </nav>

  <div class="role-switch" title="Demo only — switch role to see permission differences">
    <span class="role-switch-label">Demo role</span>
    <select id="roleSelect">
      <option value="reader">Read-only user</option>
      <option value="pending">Verification pending</option>
      <option value="contributor">Verified contributor</option>
    </select>
  </div>

  <div class="avatar" id="avatar" title="Dr. Sanskar Agrawal">SA</div>
</header>

<!-- ── Routed view ─────────────────────────────────────────────────────── -->
<main id="view" class="view"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
