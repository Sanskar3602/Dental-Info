<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Dental Info — clinical case knowledge base for dentists</title>

<!-- Tab icon: the tooth mark. The inline data-URI copy is the fallback for
     contexts that will not fetch a sibling file (e.g. some file:// cases). -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f9a9d'/%3E%3Cstop offset='.58' stop-color='%230f4f50'/%3E%3Cstop offset='1' stop-color='%2308292a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='5.5' fill='url(%23t)'/%3E%3Cpath transform='translate(2.6 2.4) scale(0.78)' fill='%23fff' d='M12 3c-2.2 0-3.2 1-5 1S4 3.4 4 6.5c0 3 1 4.6 1.7 7.2.6 2.2.8 6.3 2.6 6.3 1.6 0 1.3-4.5 3.7-4.5s2.1 4.5 3.7 4.5c1.8 0 2-4.1 2.6-6.3C19 11.1 20 9.5 20 6.5 20 3.4 18.8 4 17 4s-2.8-1-5-1z'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0f4f50">

<!-- Apply the saved theme before first paint so there is no flash -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("dentalinfo-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────────────────── -->
<header class="topbar">
  <a class="brand" href="#/browse">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c-2.2 0-3.2 1-5 1S4 3.4 4 6.5c0 3 1 4.6 1.7 7.2.6 2.2.8 6.3 2.6 6.3 1.6 0 1.3-4.5 3.7-4.5s2.1 4.5 3.7 4.5c1.8 0 2-4.1 2.6-6.3C19 11.1 20 9.5 20 6.5 20 3.4 18.8 4 17 4s-2.8-1-5-1z"/>
      </svg>
    </span>
    <span class="brand-name">Dental<em> Info</em></span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="globalSearch" class="search" type="search" autocomplete="off"
           aria-label="Search cases"
           placeholder="Search cases, complications, tools…">
    <kbd class="search-kbd">/</kbd>
  </div>

  <nav class="topnav">
    <a class="topnav-link" href="#/browse">Browse</a>
    <a class="topnav-link" href="#/contribute">Contribute</a>
    <a class="topnav-link" href="#/verify">Verification</a>
  </nav>

  <button class="icon-btn" id="themeToggle" title="Toggle light / dark" aria-label="Toggle light or dark theme">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
  </button>

  <!-- real auth state, rendered from /api/me -->
  <div class="auth-slot" id="authSlot"></div>
</header>

<!-- ── Routed view ─────────────────────────────────────────────────────── -->
<main id="view" class="view"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
